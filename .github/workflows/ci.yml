name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  # `edited` re-runs the title and body checks when either changes after the code checks passed.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer run cancels its older one; every other run keeps a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-test.txt
      - name: Every policy rule behaves as specified
        run: PYTHONPATH=src .venv/bin/python -m pytest -q
      # Each rule is broken on purpose; the run fails unless its named test catches every one.
      - name: Every rule has a test that fails when the rule is broken
        run: .venv/bin/python tests/mutate.py

  integration:
    name: Real Synapse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The negative control first: without the module the same scenario must fail, or a passing
      # run below would prove nothing.
      - name: Without the module, the scenario fails
        run: |
          if WITHOUT_MODULE=1 bash tests/integration/run.sh > control.log 2>&1; then
            cat control.log
            echo "::error::the scenario passed without the module, so it cannot tell the module works"
            exit 1
          fi
          grep -q "check(s) failed" control.log || { cat control.log; echo "::error::the control did not reach the scenario"; exit 1; }
          grep "^FAIL" control.log
      - name: With the module, every check passes
        run: bash tests/integration/run.sh

  attribution:
    name: Vendor attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove this check can fail
        run: .github/scripts/check-vendor-attribution.selftest.sh
      - name: No tracked file carries assistant attribution
        run: python3 .github/scripts/check-vendor-attribution.py .

  metadata-attribution:
    name: Vendor attribution (the surfaces that are not files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        # Named so that pipes run with pipefail: a failed producer must not read as an empty surface.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prove these checks can fail
        run: .github/scripts/check-vendor-attribution.selftest.sh
      - name: The branch name carries no attribution
        env:
          REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: >-
          printf '%s' "$REF" |
          python3 .github/scripts/check-vendor-attribution.py --text "branch name"
      - name: No commit message on this branch carries attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PUSHED: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          created=0000000000000000000000000000000000000000
          if [ -n "$BASE" ]; then
            set -- "$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$created" ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "::error::the previous tip $BEFORE is not in this clone, so no commit was scanned"
              exit 1
            fi
            set -- "$BEFORE..$PUSHED"
          elif [ -n "$BEFORE" ]; then
            held="refs/remotes/origin/$DEFAULT_BRANCH"
            if [ -z "$DEFAULT_BRANCH" ] || ! git rev-parse --verify --quiet "$held^{commit}" >/dev/null; then
              echo "::error::'$held' is not in this clone, so no commit was scanned"
              exit 1
            fi
            unread="$(git rev-list "$PUSHED" --not "$held")"
            if [ -n "$unread" ]; then
              set -- "$PUSHED" --not "$held"
            else
              set -- -1 "$PUSHED"
            fi
          else
            set -- -1
          fi
          git log --format=%B "$@" |
            python3 .github/scripts/check-vendor-attribution.py \
              --text "commit messages on this branch"
      - name: The pull request title carries no attribution
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: >-
          printf '%s' "$TITLE" |
          python3 .github/scripts/check-vendor-attribution.py
          --text "pull request title"
      - name: The pull request body carries no attribution
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.type != 'Bot'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: >-
          printf '%s' "$BODY" |
          python3 .github/scripts/check-vendor-attribution.py
          --text "pull request body" --allow-empty
      - name: No tag on this commit carries attribution
        run: >-
          git tag --points-at HEAD --format='%(refname:strip=2)%0a%(contents)' |
          python3 .github/scripts/check-vendor-attribution.py
          --text "tags on this commit" --allow-empty

  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs:
      - unit
      - integration
      - attribution
      - metadata-attribution
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove this gate can fail
        run: .github/scripts/aggregate-result.selftest.sh
      - name: Prove the coverage check can fail
        run: .github/scripts/check-aggregate-covers-jobs.selftest.sh
      - name: This gate depends on every other job
        run: python3 .github/scripts/check-aggregate-covers-jobs.py
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s' "$RESULTS" | python3 .github/scripts/aggregate-result.py
